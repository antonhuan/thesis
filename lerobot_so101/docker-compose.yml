services:
  lerobot:
    build:
      context: .
      dockerfile: Dockerfile
    image: lerobot-so101:latest
    container_name: lerobot-so101
    volumes:
      - /dev:/dev
      - ./data:/workspace
      - hf_cache:/workspace/.cache
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /tmp/.docker.xauth:/tmp/.docker.xauth
    device_cgroup_rules:
      - 'c 188:* rmw'
      - 'c 166:* rmw'
      - 'c 81:* rmw'
    environment:
      - HF_HOME=/workspace/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
      - NVIDIA_DRIVER_CAPABILITIES=all
    stdin_open: true
    tty: true
    command: bash
    privileged: true
    runtime: nvidia
    network_mode: host
volumes:
  hf_cache: