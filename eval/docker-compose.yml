services:
  lerobot-eval:
    build: .
    image: lerobot-eval:latest
    runtime: nvidia

    environment:
      - HF_TOKEN=${HF_TOKEN}
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/tmp/.docker.xauth
      - MUJOCO_GL=glfw
      - CUDA_VISIBLE_DEVICES=0
      - TOKENIZERS_PARALLELISM=false
      - LIBERO_DATA_FOLDER=/root/.cache/libero

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./eval_logs:/workspace/eval_logs
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/libero:/root/.cache/libero
      - ./live_window.py:/workspace/live_window.py:ro
      - ./custom_inference.py:/workspace/custom_inference.py:ro

    device_cgroup_rules:
      - "c 195:* rwm"
    devices:
      - /dev/dri:/dev/dri

    stdin_open: true
    shm_size: "8g"
