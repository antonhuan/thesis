services:
  lerobot-eval:
    build: .
    image: lerobot-eval:latest
    runtime: nvidia

    environment:
      - HF_TOKEN=${HF_TOKEN}
      - DISPLAY=${DISPLAY}
      - MUJOCO_GL=glfw
      - CUDA_VISIBLE_DEVICES=0
      - TOKENIZERS_PARALLELISM=false
      - LIBERO_DATA_FOLDER=/root/.cache/libero

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./eval_logs:/workspace/eval_logs
      - ~/.cache/huggingface:/root/.cache/huggingface
      - ~/.cache/libero:/root/.cache/libero

    device_cgroup_rules:
      - "c 195:* rwm"
    devices:
      - /dev/dri:/dev/dri

    stdin_open: true

    