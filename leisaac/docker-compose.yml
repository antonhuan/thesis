services:
  leisaac:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leisaac-dev
    stdin_open: true
    tty: true
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - DISPLAY=${DISPLAY}
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y
    volumes:
      # X11 forwarding for GUI
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/root/.Xauthority:rw
      # Mount your project scripts
      - ./scripts:/workspace/project/scripts
      # IsaacSim caches (persist between runs)
      - leisaac-cache-kit:/root/.cache/kit
      - leisaac-cache-ov:/root/.cache/ov
      - leisaac-cache-pip:/root/.cache/pip
      - leisaac-cache-gl:/root/.cache/nvidia/GLCache
      - leisaac-cache-compute:/root/.nv/ComputeCache
      - leisaac-logs:/root/.nvidia-omniverse/logs
      - leisaac-data:/root/.local/share/ov/data
      # Shared memory for IsaacSim
      - /dev/shm:/dev/shm
      - ./assets:/workspace/leisaac/assets
    network_mode: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  leisaac-cache-kit:
  leisaac-cache-ov:
  leisaac-cache-pip:
  leisaac-cache-gl:
  leisaac-cache-compute:
  leisaac-logs:
  leisaac-data: